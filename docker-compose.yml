services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      target: builder
    env_file:
      - ./frontend/.env
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
